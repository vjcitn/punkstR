on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            bioc::BiocCheck
          needs: check

      # No 'punkst' binary and no spatialdata-enabled Python are installed
      # here, so the vignette (which needs both) is skipped; the man-page
      # examples that need them already degrade gracefully via tryCatch().
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes")'
          build_args: 'c("--no-build-vignettes")'
          error-on: '"error"'

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(".", `quit-with-status` = FALSE)
        shell: Rscript {0}
