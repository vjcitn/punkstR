on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # bioc.r-universe.dev serves prebuilt Linux binaries for Bioconductor
      # packages (BiocCheck's dependency tree is large), so installs don't
      # have to compile everything from source on every run.
      - name: Add Bioconductor r-universe binary repo
        run: |
          echo 'options(repos = c(getOption("repos"), BiocRuniverse = "https://bioc.r-universe.dev"))' >> ~/.Rprofile
        shell: bash

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No reticulate: punkstR only ever shells out to Python with system2(),
      # so installing these into whatever interpreter PUNKST_PYTHON points at
      # is all the R side needs.
      #
      # A plain `pip install` into the bare hostedtoolcache interpreter looks
      # fine right after this step (import succeeds here), but later, when
      # rcmdcheck's test subprocess invokes that same absolute path via
      # system2(), sys.path comes back with *no* site-packages directories
      # at all even though sys.flags.no_site is 0 -- some context-dependent
      # quirk in how this build's site.py resolves its install layout.
      # A venv's interpreter carries its own pyvenv.cfg next to the binary
      # and resolves its site-packages from that file alone, independent of
      # caller context, so it isn't exposed to whatever that quirk is.
      - name: Install Python dependencies (spatialdata and friends)
        run: |
          set -euo pipefail
          python -m venv /opt/punkst-venv
          /opt/punkst-venv/bin/pip install --upgrade pip
          /opt/punkst-venv/bin/pip install numpy pandas scipy "zarr>=3" "spatialdata>=0.7"
          echo "PUNKST_PYTHON=/opt/punkst-venv/bin/python" >> "$GITHUB_ENV"
          # A later step (setup-r-dependencies, apt-installing BiocCheck's
          # system libs) rebuilds the ldconfig cache, which can shadow the
          # toolcache's own libpython3.12.so.1.0 with an incompatible one
          # found via a default search path -- surfacing as a ctypes
          # "undefined symbol" only once that step has run. Pin
          # LD_LIBRARY_PATH to the toolcache's lib dir so it keeps winning.
          echo "LD_LIBRARY_PATH=/opt/hostedtoolcache/Python/3.12.15/x64/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          /opt/punkst-venv/bin/python -c "import spatialdata, zarr; print('spatialdata', spatialdata.__version__); print('zarr', zarr.__version__)"
          realpy="$(readlink -f /opt/punkst-venv/bin/python)"
          echo "DIAG install-time realpy=${realpy} sha256=$(sha256sum "${realpy}")"
          echo "DIAG install-time nm_symbol: $(nm -D "${realpy}" 2>&1 | grep -i PyErr_SetLocaleString || echo NOT_FOUND)"
          # rcmdcheck runs R CMD check in a sanitized subprocess that drops
          # arbitrary inherited env vars, so GITHUB_ENV alone isn't enough;
          # ~/.Renviron is read by R itself at startup and survives that.
          echo "PUNKST_PYTHON=/opt/punkst-venv/bin/python" >> ~/.Renviron
          echo "LD_LIBRARY_PATH=/opt/hostedtoolcache/Python/3.12.15/x64/lib:${LD_LIBRARY_PATH:-}" >> ~/.Renviron

      # Prebuilt Linux binary from the upstream punkst releases; avoids a
      # from-source C++ build (cmake/TBB/etc.) just to run CI. The baseline
      # x86_64 build (no -v3/-v4 CPU tuning) is the safest match for an
      # unknown GitHub-hosted runner CPU.
      - name: Install punkst binary
        run: |
          set -euo pipefail
          tag="v0.1.2"
          asset="punkst-0.1.2-linux-x86_64-glibc2.28.tar.gz"
          curl -fsSL -o punkst.tar.gz \
            "https://github.com/Yichen-Si/punkst/releases/download/${tag}/${asset}"
          tar -xzf punkst.tar.gz
          dir="${asset%.tar.gz}"
          # env-check runs punkst with no subcommand, which prints the command
          # list and exits 1 by design -- that's the smoke test passing, not a
          # failure, so don't let it trip set -e.
          "./${dir}/bin/env-check" || true
          echo "${PWD}/${dir}/bin" >> "$GITHUB_PATH"
          echo "PUNKST=${PWD}/${dir}/bin/punkst" >> "$GITHUB_ENV"
          echo "PUNKST=${PWD}/${dir}/bin/punkst" >> ~/.Renviron

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            bioc::BiocCheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"error"'

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(".", `quit-with-status` = FALSE)
        shell: Rscript {0}
